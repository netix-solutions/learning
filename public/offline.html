<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A little offline play · SunSharp</title>
<link rel="icon" href="/favicon.ico" />
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100dvh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 12% 12%,#fff0ba,transparent 45%),linear-gradient(160deg,#e7f4ff,#fff7e8);color:#143a5e;font-family:ui-rounded,system-ui,-apple-system,sans-serif}main{width:100%;max-width:560px;text-align:center;background:#ffffffed;border:2px solid white;border-radius:32px;padding:28px;box-shadow:0 16px 60px #1d70c218}img{width:72px;height:72px}h1{font-size:clamp(24px,5vw,32px);margin:14px 0 8px}p{color:#4c6380;line-height:1.5;margin:8px 0}.eyebrow{font-size:13px;font-weight:800;color:#175e9e;letter-spacing:.1em;text-transform:uppercase}.game{margin-top:24px;background:#edf6ff;padding:20px;border-radius:24px}.game h2{font-size:22px;margin:0 0 16px}.stars{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:72px;align-items:center}.star{width:42px;height:42px;color:#d68b00;filter:drop-shadow(0 3px 0 #e9c86c)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}button,a{touch-action:manipulation;min-height:48px;border:0;border-radius:16px;font:inherit;font-weight:800;cursor:pointer}button{padding:12px;background:#fff;color:#175e9e;border:2px solid #d4e5f5}button:focus-visible,a:focus-visible{outline:3px solid #175e9e;outline-offset:3px}button:active{background:#d4e5f5}.choices button{font-size:24px}.reconnect{display:flex;align-items:center;justify-content:center;margin-top:20px;background:#1d70c2;color:white;text-decoration:none;padding:14px}.note{font-size:13px}#feedback{min-height:48px;margin-top:14px;font-weight:700;color:#175e9e}#next{background:#175e9e;color:white;width:100%;margin-top:8px}[hidden]{display:none!important}@media(max-height:600px) and (min-width:600px){main{max-width:850px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.game{margin-top:0}}@media(prefers-reduced-motion:no-preference){.star{animation:arrive .25s ease-out both}@keyframes arrive{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}}
</style>
</head>
<body>
<main>
<div><img src="/icon-192.png" alt="SunSharp" /><p class="eyebrow">A little offline play</p><h1>Keep your curiosity shining</h1><p>The internet is taking a break. Count some stars while you wait!</p><a class="reconnect" href="/home">Try connecting again</a><p class="note">This little game is just for fun. Tokens and progress resume when you reconnect.</p></div>
<section class="game" aria-labelledby="game-title"><h2 id="game-title">How many stars?</h2><button id="hear" aria-label="Hear how to count the stars" aria-pressed="false" style="margin-bottom:16px">Hear how to play</button><audio id="guide" preload="none" src="/audio/lessons/271f9dbdb2a54cfb50f90210229f0007f288779e0b6a2a5a19cd7efec27d514c.mp3"></audio><div id="stars" class="stars" aria-label="Stars to count"></div><div class="choices" id="choices" role="group" aria-label="Choose how many stars"></div><p id="feedback" role="status" aria-live="polite">Count each star, then pick a number.</p><button id="next" hidden>Count another sky</button></section>
</main>
<script>
(function(){
const stars=document.getElementById('stars'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),next=document.getElementById('next');let last=0;
function start(){let count=1+Math.floor(Math.random()*6);if(count===last)count=count%6+1;last=count;stars.replaceChildren();choices.replaceChildren();next.hidden=true;feedback.textContent='Count each star, then pick a number.';
for(let i=0;i<count;i++){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('class','star');svg.setAttribute('role','img');svg.setAttribute('aria-label','Star '+(i+1));svg.style.animationDelay=(i*50)+'ms';const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('fill','currentColor');path.setAttribute('d','m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2 2 9.3l6.9-1L12 2Z');svg.append(path);stars.append(svg);}
const low=Math.max(1,Math.min(count-1,5));for(let n=low;n<low+3;n++){const button=document.createElement('button');button.textContent=n;button.setAttribute('aria-label',n+' stars');button.onclick=function(){if(n===count){feedback.textContent='You counted '+count+' stars! Ready for another sky?';for(const b of choices.children)b.disabled=true;next.hidden=false;next.focus();}else{feedback.textContent='Try touching each star as you count. You can try again!';}};choices.append(button);}}
const guide=document.getElementById('guide'),hear=document.getElementById('hear');
function quiet(){hear.setAttribute('aria-pressed','false');hear.textContent='Hear how to play';}
hear.onclick=function(){if(!guide.paused){guide.pause();quiet();return;}guide.currentTime=0;guide.play().then(function(){hear.setAttribute('aria-pressed','true');hear.textContent='Stop listening';}).catch(function(){quiet();feedback.textContent='Count each star, then pick the number you see.';});};guide.onended=quiet;
next.onclick=function(){start();choices.firstElementChild.focus();};start();
})();
</script>
</body>
</html>
